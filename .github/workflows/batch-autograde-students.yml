name: Batch autograde student repositories

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: "Repositoris d'alumnes per sobreescriure el fitxer, separats per salts de línia, comes o espais"
        required: false
        default: ""
      target_group:
        description: "Grup a corregir"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - 2DAW-A
          - 2DAW-B
          - 2DAW-C
          - 2DAW-D
      repositories_file:
        description: "Fitxer opcional per sobreescriure target_group"
        required: false
        default: ""
      group:
        description: "Grup per defecte si el fitxer o l'input no especifiquen grup"
        required: false
        default: "2DAW-A"
      mode:
        description: "Motor d'autograding"
        required: true
        default: "openai"
        type: choice
        options:
          - mock
          - openai
      student_ref:
        description: "Branca del repositori de l'alumne"
        required: true
        default: "master"
      publish_to_student_repo:
        description: "Publicar autograde/latest.md i autograde/latest.json en cada repo"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  autograde:
    name: Autograde student repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout teacher repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate teacher configuration
        run: npm run validate

      - name: Batch autograde
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLASSROOM_AUTOGRADE_TOKEN || secrets.TEACHER_REPO_TOKEN || github.token }}
          STUDENT_WRITE_TOKEN: ${{ secrets.CLASSROOM_AUTOGRADE_TOKEN || secrets.TEACHER_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          INPUT_REPOSITORIES: ${{ inputs.repositories }}
          INPUT_TARGET_GROUP: ${{ inputs.target_group }}
          INPUT_REPOSITORIES_FILE: ${{ inputs.repositories_file }}
          INPUT_GROUP: ${{ inputs.group }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_STUDENT_REF: ${{ inputs.student_ref }}
          INPUT_PUBLISH_TO_STUDENT_REPO: ${{ inputs.publish_to_student_repo }}
        run: |
          set -euo pipefail

          if [ "$INPUT_MODE" = "openai" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "Falta el secret OPENAI_API_KEY en el repositori del professor."
            exit 1
          fi

          if [ "$INPUT_PUBLISH_TO_STUDENT_REPO" = "true" ] && [ -z "${STUDENT_WRITE_TOKEN:-}" ]; then
            echo "Falta CLASSROOM_AUTOGRADE_TOKEN o TEACHER_REPO_TOKEN amb permís d'escriptura sobre els repositoris d'alumnes."
            exit 1
          fi

          selected_repositories_file="$INPUT_REPOSITORIES_FILE"
          if [ -z "$selected_repositories_file" ]; then
            case "$INPUT_TARGET_GROUP" in
              all)
                selected_repositories_file="course/student-repositories.txt"
                ;;
              2DAW-A)
                selected_repositories_file="course/student-repositories-2dawa.txt"
                ;;
              2DAW-B)
                selected_repositories_file="course/student-repositories-2dawb.txt"
                ;;
              2DAW-C)
                selected_repositories_file="course/student-repositories-2dawc.txt"
                ;;
              2DAW-D)
                selected_repositories_file="course/student-repositories-2dawd.txt"
                ;;
              *)
                echo "target_group no valid: $INPUT_TARGET_GROUP"
                exit 1
                ;;
            esac
          fi

          tmp_repos="$(mktemp)"
          if [ -n "$INPUT_REPOSITORIES" ]; then
            printf '%s\n' "$INPUT_REPOSITORIES" \
              | tr ',;' '\n' \
              | sed '/^[[:space:]]*$/d' \
              | sort -u \
              | awk -v default_group="$INPUT_GROUP" '{ repo=$1; group=($2 != "" ? $2 : default_group); print repo " " group; }' > "$tmp_repos"
          else
            if [ ! -f "$selected_repositories_file" ]; then
              echo "No s'ha trobat el fitxer de repositoris: $selected_repositories_file"
              exit 1
            fi

            sed 's/#.*$//' "$selected_repositories_file" \
              | tr ',;' '\n' \
              | sed '/^[[:space:]]*$/d' \
              | sort -u \
              | awk -v default_group="$INPUT_GROUP" '{ repo=$1; group=($2 != "" ? $2 : default_group); print repo " " group; }' > "$tmp_repos"
          fi

          total="$(wc -l < "$tmp_repos" | tr -d ' ')"
          if [ "$total" -eq 0 ]; then
            echo "No s'ha indicat cap repositori d'alumne."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          batch_id="$(date -u +'%Y-%m-%dT%H-%M-%SZ')-${INPUT_TARGET_GROUP}-${INPUT_MODE}"

          echo "# Correcció massiva d'alumnes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Batch: \`$batch_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Grup seleccionat: \`$INPUT_TARGET_GROUP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Grup per defecte: \`$INPUT_GROUP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$INPUT_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fitxer repositoris: \`$selected_repositories_file\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branca alumne: \`$INPUT_STUDENT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicació en repo alumne: \`$INPUT_PUBLISH_TO_STUDENT_REPO\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total repositoris: **$total**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repositori | Grup | Nota | Revisió docent | Publicació |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---:|---|---|" >> "$GITHUB_STEP_SUMMARY"

          work_root="$RUNNER_TEMP/batch-autograde"
          rm -rf "$work_root"
          mkdir -p "$work_root"

          while read -r repo repo_group; do
            echo "Autograde $repo"
            safe_repo="${repo//\//__}"
            student_dir="$work_root/$safe_repo/repo"
            result_dir="$PWD/tmp/batch/$safe_repo"
            mkdir -p "$result_dir"

            git clone --branch "$INPUT_STUDENT_REF" --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$student_dir"
            commit_sha="$(git -C "$student_dir" rev-parse HEAD)"

            node scripts/collect-repo-evidence.mjs \
              --repo-dir "$student_dir" \
              --repo "$repo" \
              --commit "$commit_sha" \
              --repo-signals "$result_dir/repo-signals.json" \
              --evidence-summary "$result_dir/evidence-summary.json"

            node scripts/build-evaluation-payload.mjs \
              --student "$repo" \
              --group "$repo_group" \
              --repo "$repo" \
              --commit "$commit_sha" \
              --repo-signals "$result_dir/repo-signals.json" \
              --evidence-summary "$result_dir/evidence-summary.json" > "$result_dir/evaluation-payload.stdout.json"
            cp tmp/evaluation-payload.json "$result_dir/evaluation-payload.json"

            if [ "$INPUT_MODE" = "openai" ]; then
              node scripts/openai-autograde.mjs --input tmp/evaluation-payload.json > "$result_dir/autograde.stdout.json"
              cp tmp/openai-raw-response.json "$result_dir/openai-raw-response.json"
            else
              node scripts/mock-autograde.mjs --input tmp/evaluation-payload.json > "$result_dir/autograde.stdout.json"
              rm -f tmp/openai-raw-response.json
            fi

            node scripts/validate-autograde-result.mjs --input tmp/autograde-result.json
            cp tmp/autograde-result.json "$result_dir/autograde-result.json"

            node scripts/render-autograde-markdown.mjs \
              --input "$result_dir/autograde-result.json" \
              --output "$result_dir/latest.md" \
              --repo "$repo" \
              --group "$repo_group" \
              --source "$INPUT_MODE"

            node scripts/store-batch-autograde-result.mjs \
              --result "$result_dir/autograde-result.json" \
              --markdown "$result_dir/latest.md" \
              --payload "$result_dir/evaluation-payload.json" \
              --repo "$repo" \
              --group "$repo_group" \
              --source "$INPUT_MODE" \
              --batch-id "$batch_id"

            score="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('$result_dir/autograde-result.json','utf8')); process.stdout.write(String(r.final_score_over_10 ?? 'n/d'))")"
            review="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('$result_dir/autograde-result.json','utf8')); process.stdout.write(r.teacher_review_required ? 'Sí' : 'No')")"
            published="No"

            if [ "$INPUT_PUBLISH_TO_STUDENT_REPO" = "true" ]; then
              mkdir -p "$student_dir/autograde"
              cp "$result_dir/autograde-result.json" "$student_dir/autograde/latest.json"
              cp "$result_dir/latest.md" "$student_dir/autograde/latest.md"
              git -C "$student_dir" add autograde/latest.json autograde/latest.md

              if git -C "$student_dir" diff --cached --quiet; then
                published="Sense canvis"
              else
                git -C "$student_dir" commit -m "Actualitza autocorrecció ${INPUT_MODE}"
                git -C "$student_dir" push origin "HEAD:$INPUT_STUDENT_REF"
                published="Publicat"
              fi
            fi

            echo "| \`$repo\` | \`$repo_group\` | $score | $review | $published |" >> "$GITHUB_STEP_SUMMARY"
          done < "$tmp_repos"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Els resultats complets queden guardats en \`grades/history/$batch_id\` i publicats com a artifact d'aquest workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit teacher-side grade history
        shell: bash
        run: |
          set -euo pipefail

          git add grades/latest-grades.json grades/latest-grades.csv grades/history/
          if git diff --cached --quiet; then
            echo "No hi ha canvis de notes per commitejar."
            exit 0
          fi

          git commit -m "Guarda resultats d'autocorreccio massiva"
          git push

      - name: Upload teacher-side autograde artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: batch-autograde-results
          path: tmp/batch/
